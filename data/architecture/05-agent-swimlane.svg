<title id="swimtitle">Automated structure-aware consistency checking swimlane</title><desc id="swimdesc">Three lanes: Dataset/Orchestrator, LLM Agents and Python Services. No human review gate. The pipeline produces an automatic report with needs_review as an uncertainty status.</desc>
