[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-agents"
version = "0.1.0"
description = "Structure-aware hybrid FR/sequence-diagram consistency checking"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "python-dotenv>=1.0,<2", "openai-agents>=0.6,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
thesis-agents = "thesis_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thesis_agents = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
